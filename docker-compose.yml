version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  auth_service:
    build: ./auth_service
    env_file:
      - ./auth_service/.env
    depends_on:
      - postgres

  lead_management_service:
    build: ./lead_management_service
    env_file:
      - ./lead_management_service/.env
    depends_on:
      - postgres
      - redis

  chatbot_service:
    build: ./chatbot_service
    env_file:
      - ./chatbot_service/.env
    depends_on:
      - postgres
      - redis

  reporting_service:
    build: ./reporting_service
    env_file:
      - ./reporting_service/.env
    depends_on:
      - postgres
      - redis

  messaging_gateway_service:
    build: ./messaging_gateway_service
    env_file:
      - ./messaging_gateway_service/.env
    depends_on:
      - redis

volumes:
  pgdata:
