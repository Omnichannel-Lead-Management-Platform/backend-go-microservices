version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth_service:
    build: ./auth_service
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/auth_db?sslmode=disable
    depends_on:
      - postgres

  lead_management_service:
    build: ./lead_management_service
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/lead_db?sslmode=disable
    depends_on:
      - postgres
      - redis

  chatbot_service:
    build: ./chatbot_service
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/chatbot_db?sslmode=disable
    depends_on:
      - postgres
      - redis

  reporting_service:
    build: ./reporting_service
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/reporting_db?sslmode=disable
    depends_on:
      - postgres
      - redis

  messaging_gateway_service:
    build: ./messaging_gateway_service
    depends_on:
      - redis

volumes:
  pgdata:
